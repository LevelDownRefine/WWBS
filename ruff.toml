# ruff 配置：只开「能抓到真 bug」的规则，不做风格重排。
#
# 必须显式写 select。ruff 未显式配置时的默认集已随版本扩大，在本仓库会报 157 条
# （BLE001 / S110 / DTZ005 / SIM102 等），其中多数是设计层取舍而非缺陷。
target-version = "py310"

[lint]
# E4（导入位置）/ E7（语句用法）/ E9（运行时错误）/ F（pyflakes：未定义名、
# 未使用导入与变量、重复定义）。既有代码在这些规则下是干净的。
select = ["E4", "E7", "E9", "F"]

# 未启用，改动成本与收益留待后续单独评估：
#   I   导入排序    自动可修，但会产生 12 个文件的纯排序改动
#   UP  pyupgrade   约 1400 条，需按 3.10+ 全面改写
#   SIM 简化建议    部分与现有分支结构冲突
#   RUF 其它        含可变类默认值等真实问题，但需逐条判断
