# WWBS CI：单元测试
#
# 必须跑在 Windows 上：windows_client.py 依赖 `from ctypes import wintypes`，
# 该模块只在 Windows 存在；app.py 还在模块级 import tkinter。
# 不要改成 ubuntu-latest —— 会在 import 阶段直接失败。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest / Python 3.13
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # tests/ 不是包（没有 __init__.py），所以 -t 必须指向 tests 本身，
      # 同时靠 PYTHONPATH 让测试文件能 import 到仓库根目录下的 app.py。
      - name: 运行单元测试
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -t tests -v
